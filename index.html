<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Indra Permana</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🛡️</text></svg>">
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  
  <script src="https://unpkg.com/lucide@latest"></script>
  
  <style>
    :root {
      --font-main: 'Inter', sans-serif;
      --font-code: 'JetBrains Mono', monospace;
      --bg-color: #0b0f19;
      --container-bg: rgba(15, 23, 42, 0.85);
      --border-color: rgba(0, 255, 157, 0.2);
      --text-main: #f3f4f6;
      --text-muted: #9ca3af;
      --accent-color: #00ff9d;
      --card-bg: rgba(30, 41, 59, 0.7);
      --card-hover: rgba(0, 255, 157, 0.08);
      --card-border: rgba(0, 255, 157, 0.15);
      --shadow-color: rgba(0, 0, 0, 0.6);
    }

    body.light-theme {
      --bg-color: #f1f5f9;
      --container-bg: rgba(255, 255, 255, 0.9);
      --border-color: rgba(16, 185, 129, 0.3);
      --text-main: #1e293b;
      --text-muted: #64748b;
      --accent-color: #059669;
      --card-bg: rgba(241, 245, 249, 0.8);
      --card-hover: rgba(5, 150, 105, 0.08);
      --card-border: rgba(5, 150, 105, 0.2);
      --shadow-color: rgba(0, 0, 0, 0.1);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      font-family: var(--font-main);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 24px 16px;
      position: relative;
      overflow-x: hidden;
      transition: background 0.3s ease, color 0.3s ease;
    }

    .cyber-background {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 0;
      pointer-events: none;
    }

    #matrix-canvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    .container {
      width: 100%;
      max-width: 900px;
      background: var(--container-bg);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid var(--border-color);
      border-radius: 14px;
      box-shadow: 0 20px 40px var(--shadow-color);
      padding: 36px;
      z-index: 10;
      position: relative;
      margin: auto;
      transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .container.is-hidden {
      opacity: 0;
      transform: scale(0.95);
      pointer-events: none;
    }

    .terminal-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--border-color);
    }

    .terminal-dots {
      cursor: pointer;
      display: flex;
      gap: 8px;
      padding: 6px 8px;
      border-radius: 6px;
      align-items: center;
      transition: background 0.2s ease;
    }
    .terminal-dots:hover {
      background: rgba(128, 128, 128, 0.1);
    }

    .dot {
      width: 11px;
      height: 11px;
      border-radius: 50%;
      display: inline-block;
      pointer-events: none;
      transition: transform 0.2s ease;
    }
    .terminal-dots:hover .dot {
      transform: scale(1.15);
    }
