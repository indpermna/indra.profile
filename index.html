<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Indra Permana</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🛡️</text></svg>">
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  
  <script src="https://unpkg.com/lucide@latest"></script>
  
  <style>
    :root {
      --font-main: 'Inter', sans-serif;
      --font-code: 'JetBrains Mono', monospace;
      --bg-color: #0b0f19;
      --container-bg: rgba(15, 23, 42, 0.85);
      --border-color: rgba(0, 255, 157, 0.2);
      --text-main: #f3f4f6;
      --text-muted: #9ca3af;
      --accent-color: #00ff9d;
      --card-bg: rgba(30, 41, 59, 0.7);
      --card-hover: rgba(0, 255, 157, 0.08);
      --card-border: rgba(0, 255, 157, 0.15);
      --shadow-color: rgba(0, 0, 0, 0.6);
    }

    body.light-theme {
      --bg-color: #f1f5f9;
      --container-bg: rgba(255, 255, 255, 0.9);
      --border-color: rgba(16, 185, 129, 0.3);
      --text-main: #1e293b;
      --text-muted: #64748b;
      --accent-color: #059669;
      --card-bg: rgba(241, 245, 249, 0.8);
      --card-hover: rgba(5, 150, 105, 0.08);
      --card-border: rgba(5, 150, 105, 0.2);
      --shadow-color: rgba(0, 0, 0, 0.1);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      font-family: var(--font-main);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 24px 16px;
      position: relative;
      overflow-x: hidden;
      transition: background 0.3s ease, color 0.3s ease;
    }

    .cyber-background {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 0;
      pointer-events: none;
    }

    #matrix-canvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    .container {
      width: 100%;
      max-width: 900px;
      background: var(--container-bg);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid var(--border-color);
      border-radius: 14px;
      box-shadow: 0 20px 40px var(--shadow-color);
      padding: 36px;
      z-index: 10;
      position: relative;
      margin: auto;
      transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .container.is-hidden {
      opacity: 0;
      transform: scale(0.95);
      pointer-events: none;
    }

    .terminal-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--border-color);
    }

    .terminal-dots {
      cursor: pointer;
      display: flex;
      gap: 8px;
      padding: 6px 8px;
      border-radius: 6px;
      align-items: center;
      transition: background 0.2s ease;
    }
    .terminal-dots:hover {
      background: rgba(128, 128, 128, 0.1);
    }

    .dot {
      width: 11px;
      height: 11px;
      border-radius: 50%;
      display: inline-block;
      pointer-events: none;
      transition: transform 0.2s ease;
    }
    .terminal-dots:hover .dot {
      transform: scale(1.15);
    }
    .dot.red { background-color: #ff5f56; }
    .dot.yellow { background-color: #ffbd2e; }
    .dot.green { background-color: #27c93f; }

    .header-controls {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .theme-toggle-btn {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      color: var(--accent-color);
      width: 31px;
      height: 31px;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.25s ease;
    }
    .theme-toggle-btn:hover {
      background: var(--card-hover);
      border-color: var(--accent-color);
      transform: rotate(15deg) scale(1.05);
    }
    .theme-toggle-btn svg {
      width: 15px;
      height: 15px;
    }
    
    .lang-switcher {
      display: flex;
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 6px;
      padding: 2px;
      gap: 2px;
      height: 31px;
      align-items: center;
    }

    .lang-btn {
      background: transparent;
      border: none;
      color: var(--text-muted);
      font-size: 11px;
      font-family: var(--font-code);
      font-weight: 600;
      padding: 4px 7px;
      border-radius: 4px;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .lang-btn:hover {
      color: var(--accent-color);
    }
    .lang-btn.active {
      background: var(--card-hover) !important;
      color: var(--accent-color) !important;
      border: 1px solid var(--border-color) !important;
    }

    #google_translate_element,
    .goog-te-banner-frame,
    .skiptranslate {
      display: none !important;
    }

    .profile-header {
      text-align: center;
      margin-bottom: 28px;
    }

    .avatar-container {
      position: relative;
      width: 95px;
      height: 95px;
      margin: 0 auto 14px auto;
      transition: transform 0.3s ease;
    }
    .avatar-container:hover {
      transform: scale(1.03);
    }

    .avatar {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      object-fit: cover;
      border: 2px solid var(--accent-color);
      position: relative;
      z-index: 2;
    }

    .avatar-radar-ring {
      position: absolute;
      top: -5px;
      left: -5px;
      right: -5px;
      bottom: -5px;
      border-radius: 50%;
      border: 1px dashed var(--accent-color);
      animation: radarSpin 10s linear infinite;
      opacity: 0.6;
      z-index: 1;
    }

    @keyframes radarSpin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    .status-indicator {
      position: absolute;
      bottom: 2px;
      right: 2px;
      width: 12px;
      height: 12px;
      background-color: #27c93f;
      border: 2px solid var(--bg-color);
      border-radius: 50%;
      z-index: 3;
    }

    .profile-name {
      font-size: 1.6rem;
      font-weight: 700;
      margin-bottom: 4px;
      color: var(--text-main);
      letter-spacing: -0.5px;
    }

    .profile-bio {
      font-size: 0.88rem;
      color: var(--text-muted);
      font-family: var(--font-code);
      margin-bottom: 12px;
    }

    .divider {
      color: var(--accent-color);
      margin: 0 4px;
    }

    .collaboration-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 0.78rem;
      font-family: var(--font-code);
      color: var(--accent-color);
      transition: all 0.25s ease;
    }
    .collaboration-badge:hover {
      border-color: var(--accent-color);
      box-shadow: 0 0 10px rgba(0, 255, 157, 0.2);
    }

    .pulse-dot {
      width: 7px;
      height: 7px;
      background-color: var(--accent-color);
      border-radius: 50%;
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(0, 255, 157, 0.7); }
      70% { transform: scale(1); box-shadow: 0 0 0 6px rgba(0, 255, 157, 0); }
      100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(0, 255, 157, 0); }
    }

    .links-section {
      margin-bottom: 22px;
    }

    .section-title {
      font-size: 0.75rem;
      font-family: var(--font-code);
      color: var(--text-muted);
      letter-spacing: 1px;
      margin-bottom: 10px;
      text-transform: uppercase;
    }

    .grid-container, .cert-grid {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .link-card {
      display: flex;
      align-items: center;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      padding: 14px 16px;
      border-radius: 8px;
      text-decoration: none;
      color: var(--text-main);
      transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
      position: relative;
      overflow: hidden;
      cursor: pointer;
    }

    .link-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(0, 255, 157, 0.08), transparent);
      transition: 0.5s;
    }

    .link-card:hover::before {
      left: 100%;
    }

    .link-card:hover {
      background: var(--card-hover);
      border-color: var(--accent-color);
      transform: translateY(-3px);
      box-shadow: 0 6px 20px rgba(0, 255, 157, 0.18);
    }

    .card-icon {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 32px;
      height: 32px;
      color: var(--accent-color);
      margin-right: 14px;
      flex-shrink: 0;
      transition: transform 0.2s ease;
    }
    .link-card:hover .card-icon {
      transform: scale(1.1);
    }
    .card-icon svg { stroke: var(--accent-color); }

    .card-text {
      display: flex;
      flex-direction: column;
      flex-grow: 1;
      overflow: hidden;
    }

    .card-title {
      font-size: 0.95rem;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .card-sub {
      font-size: 0.75rem;
      color: var(--text-muted);
      font-family: var(--font-code);
    }

    .arrow-icon {
      width: 16px;
      height: 16px;
      color: var(--text-muted);
      transition: transform 0.25s ease, color 0.25s ease;
      flex-shrink: 0;
      margin-left: 8px;
    }

    .link-card:hover .arrow-icon {
      transform: translate(3px, -3px);
      color: var(--accent-color);
    }

    .music-card {
      display: flex;
      align-items: center;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      padding: 12px 16px;
      border-radius: 8px;
      gap: 14px;
      transition: all 0.25s ease;
    }
    .music-card:hover {
      border-color: var(--accent-color);
      box-shadow: 0 4px 16px rgba(0, 255, 157, 0.1);
    }

    .music-album-art {
      width: 42px;
      height: 42px;
      border-radius: 6px;
      overflow: hidden;
      flex-shrink: 0;
      border: 1px solid var(--card-border);
    }

    .music-album-art img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .music-info {
      display: flex;
      flex-direction: column;
      flex-grow: 1;
      overflow: hidden;
    }

    .music-label {
      font-size: 0.65rem;
      font-family: var(--font-code);
      color: var(--accent-color);
      letter-spacing: 0.5px;
    }

    .music-title {
      font-size: 0.9rem;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .music-artist {
      font-size: 0.75rem;
      color: var(--text-muted);
    }

    .sound-wave {
      display: flex;
      align-items: flex-end;
      gap: 3px;
      height: 14px;
      padding: 0 4px;
    }

    .sound-wave span {
      width: 3px;
      background-color: var(--accent-color);
      border-radius: 2px;
      animation: bounceWave 1.2s ease-in-out infinite;
      box-shadow: 0 0 6px var(--accent-color);
