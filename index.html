<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Indra Permana - Profil</title>
  <link rel="stylesheet" href="style.css">
  <!-- Font Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body class="dark-theme">

  <main class="main-container">

    <!-- Control Atas (Bahasa & Tema) -->
    <div class="top-bar">
      <div class="header-actions">
        <div class="lang-switcher">
          <button class="lang-btn">EN</button>
          <button class="lang-btn active">ID</button>
          <button class="lang-btn">JV</button>
        </div>
        <button class="theme-toggle-btn" aria-label="Toggle Theme">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="5"/>
            <line x1="12" y1="1" x2="12" y2="3"/>
            <line x1="12" y1="21" x2="12" y2="23"/>
            <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/>
            <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/>
            <line x1="1" y1="12" x2="3" y2="12"/>
            <line x1="21" y1="12" x2="23" y2="12"/>
            <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/>
            <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
          </svg>
        </button>
      </div>
    </div>

    <!-- Header Profil Ringkas -->
    <header class="profile-header">
      <img src="avatar.jpg" alt="Indra Permana" class="avatar-img">
      <h1 class="profile-name">Indra Permana</h1>
      <p class="profile-role">IT Security & Network Engineer <span class="dot-sep">•</span> Cyber Security</p>
      
      <div class="location-time-widget">
        <svg class="loc-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/>
          <circle cx="12" cy="10" r="3"/>
        </svg>
        <span>Jakarta, Indonesia (UTC+7) — <strong>09:10:42 WIB</strong></span>
      </div>
    </header>

    <!-- Jaringan & Sosial (Disatukan Horizontal) -->
    <section class="section-block">
      <span class="section-title">Jaringan & Sosial</span>
      <div class="social-row">
        <a href="https://linkedin.com/in/indpermana" target="_blank" class="social-btn">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M16 8a6 6 0 0 1 6 6v7h-4v-7a2 2 0 0 0-2-2 2 2 0 0 0-2 2v7h-4v-7a6 6 0 0 1 6-6z"/>
            <rect x="2" y="9" width="4" height="12"/>
            <circle cx="4" cy="4" r="2"/>
          </svg>
          LinkedIn
        </a>
        <a href="https://instagram.com/indpermana" target="_blank" class="social-btn">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="2" y="2" width="20" height="20" rx="5" ry="5"/>
            <path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"/>
            <line x1="17.5" y1="6.5" x2="17.51" y2="6.5"/>
          </svg>
          Instagram
        </a>
      </div>
    </section>

    <!-- Sertifikasi Ringkas -->
    <section class="section-block cert-section">
      <span class="section-title">Sertifikasi</span>
      <div class="cert-item">
        <span>CompTIA Security+</span>
        <span class="cert-issuer">CompTIA</span>
      </div>
    </section>

    <!-- Footer -->
    <footer class="site-footer">
      <p>© 2026 Indra Permana. Djamin & Dirancang kanthi Presisi.</p>
    </footer>

  </main>

</body>
</html>
