<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Indra Permana - Portofolio & Kontak</title>
  
  <!-- Font & Lucide Icons -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest"></script>

  <style>
    :root {
      --bg-color: #0b0f19;
      --card-bg: #111827;
      --card-border: #1f2937;
      --card-hover: #1f293d;
      --text-main: #f9fafb;
      --text-muted: #9ca3af;
      --accent-color: #38bdf8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      font-family: 'Inter', sans-serif;
      display: flex;
      justify-content: center;
      padding: 40px 20px;
      min-height: 100vh;
    }

    .container {
      width: 100%;
      max-width: 600px;
    }

    .section-block {
      margin-bottom: 30px;
    }

    .section-title {
      font-size: 0.85rem;
      font-weight: 700;
      letter-spacing: 0.05em;
      color: var(--text-muted);
      margin-bottom: 16px;
      text-transform: uppercase;
    }

    .social-grid {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .social-card {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background-color: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 16px 20px;
      text-decoration: none;
      color: inherit;
      transition: all 0.2s ease;
    }

    .social-card:hover {
      background-color: var(--card-hover);
      border-color: #374151;
      transform: translateY(-2px);
    }

    .card-left {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    /* Icon Styling untuk SVG & Lucide */
    .card-icon {
      width: 22px;
      height: 22px;
      color: var(--accent-color);
      flex-shrink: 0;
    }

    .card-info {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .card-title {
      font-size: 1rem;
      font-weight: 600;
      color: var(--text-main);
    }

    .card-sub {
      font-size: 0.875rem;
      color: var(--text-muted);
    }

    .action-icon {
      width: 18px;
      height: 18px;
      color: var(--text-muted);
      transition: color 0.2s ease, transform 0.2s ease;
    }

    .social-card:hover .action-icon {
      color: var(--accent-color);
      transform: translate(2px, -2px);
    }
  </style>
</head>
<body>

  <div class="container">
    <!-- Networks & Socials Section -->
    <section class="section-block">
      <h2 class="section-title">NETWORKS & SOCIALS</h2>
      <div class="social-grid">
        
        <!-- Card LinkedIn -->
        <a href="https://linkedin.com/in/indpermana" target="_blank" rel="noopener noreferrer" class="social-card">
          <div class="card-left">
            <!-- SVG Logo LinkedIn -->
            <svg class="card-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M16 8a6 6 0 0 1 6 6v7h-4v-7a2 2 0 0 0-2-2 2 2 0 0 0-2 2v7h-4v-7a6 6 0 0 1 6-6z"></path>
              <rect x="2" y="9" width="4" height="12"></rect>
              <circle cx="4" cy="4" r="2"></circle>
            </svg>
            <div class="card-info">
              <span class="card-title">LinkedIn</span>
              <span class="card-sub">linkedin.com/in/indpermana</span>
            </div>
          </div>
          <i data-lucide="arrow-up-right" class="action-icon"></i>
        </a>

        <!-- Card Instagram -->
        <a href="https://instagram.com/indpermna" target="_blank" rel="noopener noreferrer" class="social-card">
          <div class="card-left">
            <!-- SVG Logo Instagram -->
            <svg class="card-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="2" y="2" width="20" height="20" rx="5" ry="5"></rect>
              <path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"></path>
              <line x1="17.5" y1="6.5" x2="17.51" y2="6.5"></line>
            </svg>
            <div class="card-info">
              <span class="card-title">Instagram</span>
              <span class="card-sub">@indpermna</span>
            </div>
          </div>
          <i data-lucide="arrow-up-right" class="action-icon"></i>
        </a>

      </div>
    </section>
  </div>

  <script>
    // Inisialisasi ikon panah Lucide
    lucide.createIcons();
  </script>
</body>
</html>
